<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#0F172A"/>
  <!-- Laser grid lines -->
  <path d="M20 50 H80 M50 20 V80" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Outer parking frame -->
  <rect x="25" y="25" width="50" height="50" rx="12" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <!-- Laser Beam -->
  <line x1="20" y1="20" x2="50" y2="50" stroke="#22C55E" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 6px #22C55E)"/>
  <circle cx="50" cy="50" r="4" fill="#22C55E"/>
  <!-- P symbol -->
  <path d="M42 66 V34 H54 C58.4 34 62 37.6 62 42 C62 46.4 58.4 50 54 50 H42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
